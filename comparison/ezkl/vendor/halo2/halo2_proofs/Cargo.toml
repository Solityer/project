[package]
name = "halo2_proofs"
version = "0.3.0"
authors = [
    "Sean Bowe <sean@electriccoin.co>",
    "Ying Tong Lai <yingtong@electriccoin.co>",
    "Daira Hopwood <daira@electriccoin.co>",
    "Jack Grigg <jack@electriccoin.co>",
]
edition = "2021"
rust-version = "1.66.0"
description = """
Fast PLONK-based zero-knowledge proving system with no trusted setup
"""
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/halo2"
documentation = "https://docs.rs/halo2_proofs"
categories = ["cryptography"]
keywords = ["halo", "proofs", "zkp", "zkSNARKs"]

[dependencies]
log = { version = "0.4.17", default_features = false }
ff = "0.13"
group = "0.13"
halo2curves = { path = "../../halo2curves/halo2curves", default-features = false }
rand_core = { version = "0.6", default-features = false }
tracing = "0.1"
blake2b_simd = "1" # MSRV 1.66.0
sha3 = "0.9.1"
rand_chacha = "0.3"
maybe-rayon = { version = "0.1.1"}
rustc-hash = "2.0.0"
lazy_static = "1.4.0"
# GPU Icicle integration
icicle-core = { path = "../../icicle/rust/icicle-core", package="icicle-core", optional = true }
icicle-bn254 = { path = "../../icicle/rust/icicle-curves/icicle-bn254", package="icicle-bn254", optional = true }
icicle-runtime = { path = "../../icicle/rust/icicle-runtime", package="icicle-runtime", optional = true }
bincode = { version = "1.3.3", default_features = false }
serde = { version = "1.0.126", features = ["derive"] }
instant = { version = "0.1" }

[features]
default = ["batch", "bits", "derive_serde", "mv-lookup"]
gpu-accelerated = [
    "icicle-core",
    "icicle-core/cuda_backend",
    "icicle-bn254",
    "icicle-bn254/cuda_backend",
    "icicle-runtime",
    "icicle-runtime/cuda_backend",
]
asm = ["halo2curves/asm"]
bits = ["halo2curves/bits"]
thread-safe-region = []
sanity-checks = []
batch = ["rand_core/getrandom"]
circuit-params = []
counter = []
mv-lookup = []
derive_serde = ["halo2curves/derive_serde"]
parallel-poly-read = []
precompute-coset = []
multicore = []

[lib]
bench = false
