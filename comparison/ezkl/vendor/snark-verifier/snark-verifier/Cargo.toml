[package]
name = "snark-verifier"
version = "0.1.1"
edition = "2021"

[dependencies]
itertools = "0.10.3"
lazy_static = "1.4.0"
num-bigint = "0.4.3"
num-integer = "0.1.45"
num-traits = "0.2.15"
rand = "0.8"
hex = "0.4"
halo2_curves = { package = "halo2curves", path = "../../halo2curves/halo2curves", features = ["derive_serde"] }


# parallel
rayon = { version = "1.5.3", optional = true }

# system_halo2
halo2_proofs = { path = "../../halo2/halo2_proofs", optional = true }

# loader_halo2
halo2_wrong_ecc = { path = "../../halo2wrong/ecc", package = "ecc", optional = true }
poseidon = { path = "../../poseidon", optional = true }

# derive_serde
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []

parallel = ["dep:rayon"]
mv-lookup = ["halo2_proofs?/mv-lookup"]
# loaders
loader_halo2 = ["dep:halo2_proofs", "dep:halo2_wrong_ecc", "dep:poseidon"]

# systems
system_halo2 = ["dep:halo2_proofs"]

# features of halo2
halo2_circuit_params = [
    "halo2_proofs?/circuit-params",
    "halo2_wrong_ecc?/circuit-params",
]
derive_serde = ["dep:serde"]
