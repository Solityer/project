[package]
name = "halo2wrong"
version = "0.1.0"
authors = ["kilic <kiliconu@itu.edu.tr>"]
edition = "2021"

[dependencies]
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"
halo2 = { package = "halo2_proofs", path = "../../halo2/halo2_proofs" }

[features]
default = []
circuit-params = ["halo2/circuit-params"]
mv-lookup = ["halo2/mv-lookup"]
