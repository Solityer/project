[workspace]
resolver = "2"
members = [
  "icicle-runtime",
  "icicle-core",
  "icicle-curves/icicle-bn254",
  "icicle-hash",
]
exclude = []

[workspace.package]
version = "3.7.0"
edition = "2021"
authors = ["Ingonyama"]
homepage = "https://www.ingonyama.com"
repository = "https://github.com/ingonyama-zk/icicle"

[workspace.dependencies]
icicle-core = { path = "icicle-core" }
icicle-runtime = { path = "icicle-runtime" }
icicle-hash = { path = "icicle-hash" }
