[package]
name = "icicle-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0.97"
sha2 = "0.10.9"

[build-dependencies]
cmake = "0.1.50"
cc = "1.2.52"

[features]
# Enabling the CUDA feature builds the backend only from baseline-local
# sources under icicle/backend/cuda.  There is deliberately no pull feature.
cuda_backend = []
