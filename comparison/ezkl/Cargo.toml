cargo-features = ["profile-rustflags"]

[package]
name = "ezkl"
version = "0.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ezkl"
crate-type = ["rlib"]


[dependencies]
halo2_gadgets = { path = "vendor/halo2/halo2_gadgets" }
halo2curves = { path = "vendor/halo2curves/halo2curves", features = [
    "derive_serde",
] }
halo2_proofs = { path = "vendor/halo2/halo2_proofs", package = "halo2_proofs", features = [
    "circuit-params", "mv-lookup"
] }
rand = { version = "0.8", default-features = false }
itertools = { version = "0.10.3", default-features = false }
serde = { version = "1.0.126", features = ["derive"] }
log = { version = "0.4.17", default-features = false }
thiserror = { version = "1.0.38", default-features = false }
hex = { version = "0.4.3", default-features = false }
halo2_wrong_ecc = { path = "vendor/halo2wrong/ecc", package = "ecc" }
snark-verifier = { path = "vendor/snark-verifier/snark-verifier", default-features = false, features = [
    "derive_serde", "mv-lookup", "loader_halo2", "system_halo2"
] }
icicle-runtime = { path = "vendor/icicle/rust/icicle-runtime", package = "icicle-runtime", optional = true }
maybe-rayon = { version = "0.1.1", default-features = false }
bincode = { version = "1.3.3", default-features = false }
num = "0.4.1"
unzip-n = "0.1.2"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { version = "1.0.97", features = ["float_roundtrip", "raw_value"] }
instant = { version = "0.1" }
sha256 = { version = "1.4.0", optional = true }


[build-dependencies]
sha2 = "0.10.9"
cc = "1.2.52"

[[bin]]
name = "ezkl_formal"
test = false
bench = false
required-features = ["formal"]

[features]
formal = [
    "halo2_proofs/circuit-params",
    "halo2_proofs/mv-lookup",
    "snark-verifier/mv-lookup",
    "dep:sha256",
]
gpu-accelerated = [
    "halo2_proofs/gpu-accelerated",
    "icicle-runtime/cuda_backend",
    "dep:icicle-runtime",
]


[profile.release]
# debug = true
rustflags = ["-C", "relocation-model=pic"]
lto = "fat"
codegen-units = 1
# panic = "abort"
