[package]
name = "zkdl-gat-formal"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
gpu = []

[[bin]]
name = "zkdl-formal"
path = "src/formal/main.rs"

[dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
blst = "0.3.16"
clap = { version = "4.5.54", features = ["derive"] }
getrandom = "0.2.17"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
