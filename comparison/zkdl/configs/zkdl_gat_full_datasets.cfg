# zkDL-GAT 全数据集对比实验入口配置。
# 本文件用于复现实验口径；gat_zkdl 内部也保留同一数据集顺序。

dataset_order = cora,citeseer,pubmed,ppi,ogbn-arxiv
benchmark_mode = warm
compute_backend = gpu
project_root = /home/pzh/project
output_root = /home/pzh/project/comparison/baselines/zkdl/zkdl_gat_outputs

[cora]
cache = data/cache/cora
checkpoint_bundle = artifacts/checkpoints/cora_gat
source_config = configs/cora_full.cfg
task_type = transductive_node_classification
report_unit = node
batching_rule = whole_graph_single
batch_graphs = 1
L = 2
hidden_profile = 8x8
d_in_profile = 1433
K_out = 1
C = 7

[citeseer]
cache = data/cache/citeseer
checkpoint_bundle = artifacts/checkpoints/citeseer_gat
source_config = configs/citeseer_full.cfg
task_type = transductive_node_classification
report_unit = node
batching_rule = whole_graph_single
batch_graphs = 1
L = 2
hidden_profile = 8x8
d_in_profile = 3703
K_out = 1
C = 6

[pubmed]
cache = data/cache/pubmed
checkpoint_bundle = artifacts/checkpoints/pubmed_gat
source_config = configs/pubmed_full.cfg
task_type = transductive_node_classification
report_unit = node
batching_rule = whole_graph_single
batch_graphs = 1
L = 2
hidden_profile = 8x8
d_in_profile = 500
K_out = 1
C = 3

[ppi]
cache = data/cache/ppi
checkpoint_bundle = artifacts/checkpoints/ppi_gat
source_config = configs/ppi_batch_formal.cfg
task_type = inductive_multi_graph_node_classification
report_unit = graph
batching_rule = multi_graph_batch
batch_graphs = 295
L = 2
hidden_profile = 1x8
d_in_profile = 50
K_out = 1
C = 121

[ogbn-arxiv]
cache = data/cache/ogbn_arxiv
checkpoint_bundle = artifacts/checkpoints/ogbn_arxiv_gat
source_config = configs/ogbn_arxiv_full.cfg
task_type = transductive_node_classification
report_unit = node
batching_rule = whole_graph_single
batch_graphs = 1
L = 2
hidden_profile = 1x8
d_in_profile = 128
K_out = 1
C = 40
